project:
  name: FintechProject1
  version: "0.1.0"
  description: "Customer Lifecycle & Credit Risk Analytics Platform"

database:
  driver: postgresql
  host: ${DB_HOST}
  port: ${DB_PORT}
  database: ${DB_NAME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  data_exports: data/exports
  models: models
  reports: reports
  logs: logs

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: logs/pipeline.log

models:
  random_state: 42
  test_size: 0.2

exports:
  format: parquet
  compression: snappy
