version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Override command to natively support hot-reloading
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      # Mount host code for instant synchronization
      - ./src:/app/src
      - ./config:/app/config
      # Expose registry transparently to host for model inspection
      - ./models/registry:/app/models/registry

  db:
    ports:
      - "5432:5432"
