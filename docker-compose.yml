version: "3.8"

services:
  db:
    image: postgres:15
    container_name: fintech_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-fintech_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fintech_secret}
      POSTGRES_DB: ${DB_NAME:-fintech_analytics}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintech_api
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-fintech_user}
      - DB_PASSWORD=${DB_PASSWORD:-fintech_secret}
      - DB_NAME=${DB_NAME:-fintech_analytics}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_VERSION=${API_VERSION:-1.0.0}
      - USE_SQLITE=False
      - DATABASE_URL=postgresql://${DB_USER:-fintech_user}:${DB_PASSWORD:-fintech_secret}@db:5432/${DB_NAME:-fintech_analytics}
    ports:
      - "8000:8000"
    volumes:
      - model_registry:/app/models/registry
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Native python check avoiding curl installation
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  model_registry:
